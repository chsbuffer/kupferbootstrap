[project]
name = "kupferbootstrap"
dependencies = [
    "appdirs>=1.4.4",
    "click>=8.0.1",
    "coloredlogs",
    "enlighten",
    "joblib>=1.0.1",
    "munch",
    "python-dateutil",
    "PyYAML",
    "requests",
    "semver",
    "toml",
    "typing_extensions",
]
dynamic = ["version"]
requires-python = ">= 3.11"

[project.optional-dependencies]
all = ["kupferbootstrap[dev]", "kupferbootstrap[docs]"]

dev = [
    "autoflake",
    "mypy",
    "yapf",
    "pytest",
    "pytest-cov",
    "pytest-order",
]

docs = [
    "furo", # furo sphinx theme
    "myst-parser",
    "sphinx-click",
    "versjon<=2.3.0",
]

[project.scripts]
kupferbootstrap = "kupferbootstrap.main:main"
kupferbootstrap_wrapper_su_helper = "kupferbootstrap.wrapper.su_helper:kupferbootstrap_su"

[tool.setuptools.package-data]
"*" = ["version.txt"]

[build-system]
requires = [ "setuptools>=41", "wheel", "setuptools-git-versioning<2", ]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true


[tool.pytest.ini_options]
"markers" = [
    "integration: run integration tests",
]
